# Lavalink v4 Configuration
# Official Lavalink Repository: https://github.com/lavalink-devs/Lavalink
# Maintained by HELIX Origin

server:
  port: ${PORT:23333}
  address: ${SERVER_ADDRESS:127.0.0.1}
  undertow:
    buffer-size: 1024
    direct-buffers: true
    threads:
      io: 4
      worker: 32

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.topi.wtf/releases"
      snapshot: false
  server:
    password: "${LAVA_PASS:youshallnotpass}"
    sources:
      youtube: false
      soundcloud:
        searchEnabled: true
        filterOutPreviewTracks: true
      bandcamp: true
      vimeo: true
      nico: true
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 10000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 30000
    playersTimeout: 0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/}"
      password: "${YOUTUBE_CIPHER_PASSWORD:}"
    clients:
      - TV
      - MUSIC
      - ANDROID_VR
      - IOS
      - WEB
      - WEBEMBEDDED
    clientOptions:
      TV:
        playback: true
        videoLoading: true
        playlistLoading: true
        searching: true
      ANDROID_VR:
        playback: true
        videoLoading: true
      IOS:
        playback: true
        videoLoading: true
      MUSIC:
        playback: true
        videoLoading: true
        searching: true
      WEB:
        playback: true
        videoLoading: true
        searching: true
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: "${YOUTUBE_SKIP_INIT:false}"
  lavasrc:
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      soundcloud: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true

logging:
  level:
    root: INFO
    lavalink: INFO
    io.undertow.websockets.jsr: ERROR
    dev.lavalink.youtube.http.YoutubeOauth2Handler: DEBUG
