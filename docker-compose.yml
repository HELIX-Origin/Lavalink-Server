version: '3.8'

services:
  lavalink:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-2333}:2333"
    environment:
      - LAVA_PASS=${LAVA_PASS:-youshallnotpass}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_CIPHER_URL=${YOUTUBE_CIPHER_URL:-https://cipher.kikkia.dev/}
      - YOUTUBE_CIPHER_PASSWORD=${YOUTUBE_CIPHER_PASSWORD:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - KEEP_ALIVE_ENABLED=${KEEP_ALIVE_ENABLED:-true}
    volumes:
      - ./data:/opt/Lavalink/data
