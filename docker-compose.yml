version: '3.8'

services:
  lavalink:
    build: .
    restart: unless-stopped
    ports:
      - "${LAVA_INTERNAL_PORT:-2333}:2333"  # Lavalink node (internal)
      - "${LAVA_GATEWAY_PORT:-2334}:2334"  # Dashboard/Gateway (internal + 1)
    environment:
      # Lavalink Connection & Security
      - LAVA_INTERNAL_URL=${LAVA_INTERNAL_URL:-0.0.0.0:2333}
      - LAVA_PUBLIC_URL=${LAVA_PUBLIC_URL:-}
      - LAVA_INTERNAL_WS_URI=${LAVA_INTERNAL_WS_URI:-ws://0.0.0.0:2333/v4/websocket}
      - LAVA_PUBLIC_WS_URI=${LAVA_PUBLIC_WS_URI:-}
      - LAVA_PASS=${LAVA_PASS:-youshallnotpass}
      - LAVA_CIPHER_URL=${LAVA_CIPHER_URL:-https://cipher.kikkia.dev/}
      - LAVA_CIPHER_PASSWORD=${LAVA_CIPHER_PASSWORD:-}
      # YouTube OAuth
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      # Spotify
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # Genius (LavaLyrics)
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN:-}
      # Database
      - DB_PATH=${DB_PATH:-./database.db}
      - DB_URI=${DB_URI:-sqlite://./database.db}
      # Dashboard
      - DASHBOARD_THEME=${DASHBOARD_THEME:-dark}
      - DASHBOARD_COLOR_SCHEME=${DASHBOARD_COLOR_SCHEME:-default}
      # Environment
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - ./data:/opt/Lavalink/data