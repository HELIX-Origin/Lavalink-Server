app = "helix-lavalink-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  YOUTUBE_CIPHER_URL = "https://cipher.kikkia.dev/"

[http_service]
  internal_port = 2333
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
